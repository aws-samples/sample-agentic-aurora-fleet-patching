AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Aurora Patch Agent — Cross-Account IAM Role
  Deploy this template in each target AWS account that the patch agent should scan/patch.
  The role grants least-privilege access for fleet discovery, Blue/Green upgrades,
  and post-upgrade validation.

Parameters:
  OrchestratorAccountId:
    Type: String
    Description: AWS Account ID where the Aurora Patch Agent is deployed (the account that will AssumeRole into this one)
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID

  ExternalId:
    Type: String
    Description: (Optional) External ID for additional cross-account trust security
    Default: ''

  ReadOnlyMode:
    Type: String
    Description: Set to 'true' to grant only read/scan permissions (no upgrade execution)
    Default: 'false'
    AllowedValues: ['true', 'false']

  RoleName:
    Type: String
    Description: Name for the cross-account role
    Default: AuroraPatchAgentRole

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, '']]
  AllowWriteAccess: !Equals [!Ref ReadOnlyMode, 'false']

Resources:
  # Permissions are defined as separate AWS::IAM::ManagedPolicy resources (rather
  # than inline Policies: on the role) and then attached below. Functionally
  # identical for this template — the role is still deployed standalone, once
  # per target account, with nothing else to share the policy with — but this
  # follows AWS's general IAM guidance to prefer managed policies (centrally
  # versioned/updatable, satisfies cfn-guard's IAM_NO_INLINE_POLICY_CHECK) over
  # inline policies (1:1 with a single identity, edited in place).
  AuroraPatchAgentReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RoleName}ReadPolicy'
      Description: Read-only permissions for Aurora Patch Agent — fleet discovery, version checking, health monitoring
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RDSReadAccess
            Effect: Allow
            # NOTE: this used to be an enumerated action list, but it fell out of
            # sync with the RDS calls the agent actually makes (e.g.
            # DescribeGlobalClusters, DescribeDBSnapshots) and ended up duplicated
            # as a second `Action:` key in this same statement — a YAML mapping
            # can't have two keys with the same name, so CloudFormation/yaml
            # parsers silently used the last one (rds:Describe*/rds:List*, which
            # is what's actually in effect today). Keeping only that one so the
            # template reflects the real, already-deployed permission set.
            Action:
              - rds:Describe*
              - rds:List*
            Resource: '*'
          - Sid: CloudWatchReadAccess
            Effect: Allow
            Action:
              - cloudwatch:GetMetricStatistics
              - cloudwatch:GetMetricData
              - cloudwatch:DescribeAlarms
              - cloudwatch:ListMetrics
            Resource: '*'
          - Sid: HealthAPIAccess
            Effect: Allow
            Action:
              - health:DescribeEvents
              - health:DescribeEventDetails
            Resource: '*'
          - Sid: RDSConnectAccess
            Effect: Allow
            Action:
              - rds-db:connect
            Resource: !Sub 'arn:aws:rds-db:*:${AWS::AccountId}:dbuser:*/aurora_patch_agent'

  # Write access: Blue/Green deployment management (conditional on ReadOnlyMode).
  #
  # Resource scoping note: every action below is called by the agent against
  # a specific existing DB cluster (see agents/execution/, agents/rollback/),
  # and always within this account (this role only exists in the target
  # account it's deployed to). Scoping Resource to this account's RDS ARNs
  # (rather than the account-independent '*') means the policy can't be
  # exploited against RDS resources in another account even if the trust
  # policy or role were ever misconfigured. Region and resource identifier
  # are still wildcarded because:
  #   - the agent operates across all regions listed in its TARGET_ACCOUNTS
  #     config, not one fixed region
  #   - cluster identifiers are discovered dynamically (describe_db_clusters),
  #     not known ahead of time, and snapshot/blue-green-deployment names are
  #     generated by the agent at call time (see preflight.py, execution/handler.py)
  #
  # Only actions with real call sites in agents/ or api/server.py are granted.
  # Previously this list also included ModifyDBInstance, CreateDBSnapshot,
  # DeleteDBClusterSnapshot, CreateDBClusterParameterGroup,
  # CopyDBClusterParameterGroup, AddTagsToResource, and RemoveTagsFromResource,
  # none of which have any call site in the codebase — removed rather than
  # scoped, since unused permissions are pure attack surface with no
  # functional cost to dropping.
  AuroraPatchAgentWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: AllowWriteAccess
    Properties:
      ManagedPolicyName: !Sub '${RoleName}WritePolicy'
      Description: Write permissions for Aurora Patch Agent — Blue/Green and in-place upgrade execution
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BlueGreenDeploymentManagement
            Effect: Allow
            Action:
              - rds:CreateBlueGreenDeployment
              - rds:SwitchoverBlueGreenDeployment
              - rds:DeleteBlueGreenDeployment
            Resource:
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:cluster:*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:blue-green-deployment:*'
          - Sid: InPlaceUpgrade
            Effect: Allow
            Action:
              - rds:ModifyDBCluster
            Resource:
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:cluster:*'
          - Sid: SnapshotManagement
            Effect: Allow
            Action:
              - rds:CreateDBClusterSnapshot
            Resource:
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:cluster:*'
              - !Sub 'arn:aws:rds:*:${AWS::AccountId}:cluster-snapshot:*'

  AuroraPatchAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Cross-account role for Aurora Patch Agent fleet scanning and upgrade execution
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${OrchestratorAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition: !If
              - HasExternalId
              - StringEquals:
                  'sts:ExternalId': !Ref ExternalId
              - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Ref AuroraPatchAgentReadPolicy
        - !If
          - AllowWriteAccess
          - !Ref AuroraPatchAgentWritePolicy
          - !Ref AWS::NoValue

      Tags:
        - Key: project
          Value: aurora-patch-agent
        - Key: managed-by
          Value: cloudformation

Outputs:
  RoleArn:
    Description: ARN of the cross-account role (use this in the agent's TARGET_ACCOUNTS config)
    Value: !GetAtt AuroraPatchAgentRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'

  RoleName:
    Description: Name of the created role
    Value: !Ref AuroraPatchAgentRole

  ConfigSnippet:
    Description: JSON snippet to add to the agent's TARGET_ACCOUNTS configuration
    Value: !Sub |
      {
        "account_id": "${AWS::AccountId}",
        "role_arn": "${AuroraPatchAgentRole.Arn}",
        "regions": ["${AWS::Region}"],
        "alias": "CHANGE_ME",
        "environment": "CHANGE_ME"
      }
